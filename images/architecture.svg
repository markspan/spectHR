<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1240"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .layer-ui  { fill: #eff6ff; }
      .layer-cfg { fill: #fffbeb; }
      .layer-lib { fill: #f0fdf4; }
      .layer-com { fill: #fdf2f8; }
      .box-ui  { fill: #dbeafe; stroke: #1e40af; stroke-width: 1.5; }
      .box-cfg { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .box-lib { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .box-com { fill: #fce7f3; stroke: #be185d; stroke-width: 1.5; }
      .arrow   { stroke: #374151; stroke-width: 1.6; fill: none; }
      .title       { font-size: 22px; font-weight: 700; fill: #111827; }
      .subtitle    { font-size: 13px; fill: #6b7280; }
      .lane-label  { font-size: 15px; font-weight: 700; }
      .ui-label    { fill: #1e3a8a; }
      .cfg-label   { fill: #92400e; }
      .lib-label   { fill: #14532d; }
      .com-label   { fill: #9d174d; }
      .label       { font-size: 13px; fill: #111827; }
      .label-bold  { font-size: 13px; fill: #111827; font-weight: 700; }
      .sub         { font-size: 11px; fill: #4b5563; }
      .code        { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
      .arr-label   { font-size: 11px; fill: #374151; font-style: italic; }
    </style>
  </defs>

  <!-- Header -->
  <text x="560" y="34" text-anchor="middle" class="title">spectHR architecture</text>
  <text x="560" y="54" text-anchor="middle" class="subtitle">
    spectUI is the only reader of configuration; spectHR is pure compute.
  </text>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- Lane 1: workspace I/O                                    -->
  <!-- ─────────────────────────────────────────────────────── -->
  <rect x="20" y="78" width="1080" height="118" class="layer-ui" rx="6"/>
  <text x="36" y="100" class="lane-label ui-label">spectUI · workspace I/O</text>

  <rect x="40"  y="118" width="200" height="60" rx="4" class="box-ui"/>
  <text x="140" y="142" text-anchor="middle" class="label">DefaultWorkSpace.json</text>
  <text x="140" y="162" text-anchor="middle" class="sub">on disk · user-editable</text>

  <rect x="280" y="118" width="200" height="60" rx="4" class="box-ui"/>
  <text x="380" y="142" text-anchor="middle" class="label">LoadWorkspace</text>
  <text x="380" y="162" text-anchor="middle" class="sub">workSpace.py</text>

  <rect x="520" y="118" width="200" height="60" rx="4" class="box-ui"/>
  <text x="620" y="142" text-anchor="middle" class="label-bold">workspace · dict</text>
  <text x="620" y="162" text-anchor="middle" class="sub">live in-memory config</text>

  <rect x="760" y="118" width="220" height="60" rx="4" class="box-ui"/>
  <text x="870" y="142" text-anchor="middle" class="label">WorkSpaceEditor</text>
  <text x="870" y="162" text-anchor="middle" class="sub">Edit Parameters dialog</text>

  <line x1="240" y1="148" x2="280" y2="148" class="arrow" marker-end="url(#arrow)"/>
  <line x1="480" y1="148" x2="520" y2="148" class="arrow" marker-end="url(#arrow)"/>
  <line x1="760" y1="138" x2="720" y2="138" class="arrow" marker-end="url(#arrow)"/>
  <line x1="720" y1="158" x2="760" y2="158" class="arrow" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- Lane 2: configuration translation                        -->
  <!-- ─────────────────────────────────────────────────────── -->
  <rect x="20" y="216" width="1080" height="200" class="layer-cfg" rx="6"/>
  <text x="36" y="238" class="lane-label cfg-label">Configuration translation · workSpace.py</text>

  <rect x="380" y="252" width="360" height="44" rx="4" class="box-cfg"/>
  <text x="560" y="278" text-anchor="middle" class="code">psd_method_from_workspace(workspace)</text>

  <rect x="180" y="312" width="760" height="60" rx="4" class="box-cfg"/>
  <text x="200" y="332" class="label-bold">PsdMethod   (frozen dataclass)</text>
  <text x="200" y="352" class="code">algorithm  ·  bands: Dict[str, BandSpec]  ·  alpha_ci  ·  mean_convention</text>
  <text x="200" y="368" class="code">welch: WelchOptions   lombscargle: LombscargleOptions   carspan: CarspanOptions</text>

  <rect x="380" y="386" width="360" height="22" rx="4" class="box-cfg"/>
  <text x="560" y="402" text-anchor="middle" class="code">apply_psd_method_to_dataset(dataset, method)</text>

  <line x1="620" y1="178" x2="620" y2="252" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="296" x2="560" y2="312" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="372" x2="560" y2="386" class="arrow" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- Lane 3: spectHR library                                  -->
  <!-- ─────────────────────────────────────────────────────── -->
  <rect x="20" y="436" width="1080" height="356" class="layer-lib" rx="6"/>
  <text x="36" y="458" class="lane-label lib-label">spectHR library</text>

  <rect x="40"  y="476" width="240" height="92" rx="4" class="box-lib"/>
  <text x="160" y="498" text-anchor="middle" class="label-bold">PhysioData</text>
  <text x="160" y="518" text-anchor="middle" class="code">hrv_map : band → CardioSeries</text>
  <text x="160" y="536" text-anchor="middle" class="code">epochs  : label → Epoch</text>
  <text x="160" y="554" text-anchor="middle" class="code">timeseries · active_band · hrv</text>

  <rect x="340" y="476" width="260" height="120" rx="4" class="box-lib"/>
  <text x="470" y="498" text-anchor="middle" class="label-bold">CardioSeries  (master)</text>
  <text x="470" y="518" text-anchor="middle" class="code">.times  .ibi  .labels</text>
  <text x="470" y="538" text-anchor="middle" class="code">.psd_method  ← set by UI</text>
  <text x="470" y="562" text-anchor="middle" class="sub">+ CardioMetricsMixin (time)</text>
  <text x="470" y="580" text-anchor="middle" class="sub">+ CardioFrequencyMetricsMixin (freq)</text>

  <rect x="660" y="476" width="260" height="120" rx="4" class="box-lib"/>
  <text x="790" y="498" text-anchor="middle" class="label-bold">CardioSeriesView</text>
  <text x="790" y="516" text-anchor="middle" class="sub">per-epoch zero-copy slice</text>
  <text x="790" y="536" text-anchor="middle" class="code">.times[idx] .ibi .labels</text>
  <text x="790" y="556" text-anchor="middle" class="code">.psd_method  →  parent</text>
  <text x="790" y="580" text-anchor="middle" class="sub">same mixin methods</text>

  <rect x="220" y="624" width="680" height="100" rx="4" class="box-lib"/>
  <text x="560" y="646" text-anchor="middle" class="label-bold">Public API on CardioSeries / CardioSeriesView</text>
  <text x="560" y="668" text-anchor="middle" class="code">series.psd(with_ci=True) → PSDResult</text>
  <text x="560" y="688" text-anchor="middle" class="code">series.band_power(name) / .band_powers() → float / Dict[str,float]</text>
  <text x="560" y="708" text-anchor="middle" class="code">series.rmssd · sdnn · sd1 · sd2 · lf_power · hf_power · lf_hf_ratio · …</text>

  <rect x="220" y="740" width="680" height="40" rx="4" class="box-lib"/>
  <text x="560" y="765" text-anchor="middle" class="label">dispatch on  method.algorithm  →  _psd_welch / _psd_lombscargle / _psd_carspan / _psd_carspan_strict</text>

  <line x1="560" y1="408" x2="470" y2="476" class="arrow" marker-end="url(#arrow)"/>
  <text x="430" y="442" class="arr-label">sets attribute on every master series</text>

  <line x1="280" y1="520" x2="340" y2="520" class="arrow" marker-end="url(#arrow)"/>
  <line x1="600" y1="540" x2="660" y2="540" class="arrow" marker-end="url(#arrow)"/>
  <text x="618" y="534" class="arr-label">__getitem__(epoch)</text>

  <line x1="470" y1="596" x2="470" y2="624" class="arrow" marker-end="url(#arrow)"/>
  <line x1="790" y1="596" x2="790" y2="624" class="arrow" marker-end="url(#arrow)"/>

  <line x1="560" y1="724" x2="560" y2="740" class="arrow" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- Lane 4: compute layer                                    -->
  <!-- ─────────────────────────────────────────────────────── -->
  <rect x="20" y="812" width="1080" height="180" class="layer-com" rx="6"/>
  <text x="36" y="834" class="lane-label com-label">Pure compute functions · spectHR.Tools.PSD</text>

  <rect x="40"  y="852" width="240" height="62" rx="4" class="box-com"/>
  <text x="160" y="877" text-anchor="middle" class="label">compute_welch_psd</text>
  <text x="160" y="898" text-anchor="middle" class="code">options: WelchOptions</text>

  <rect x="300" y="852" width="240" height="62" rx="4" class="box-com"/>
  <text x="420" y="877" text-anchor="middle" class="label">compute_lombscargle_psd</text>
  <text x="420" y="898" text-anchor="middle" class="code">options: LombscargleOptions</text>

  <rect x="560" y="852" width="240" height="62" rx="4" class="box-com"/>
  <text x="680" y="877" text-anchor="middle" class="label">compute_carspan_psd</text>
  <text x="680" y="898" text-anchor="middle" class="code">options: CarspanOptions</text>

  <rect x="820" y="852" width="240" height="62" rx="4" class="box-com"/>
  <text x="940" y="877" text-anchor="middle" class="label">compute_carspan_psd_strict</text>
  <text x="940" y="898" text-anchor="middle" class="sub">thin wrapper · CARSPAN preset</text>

  <line x1="560" y1="780" x2="560" y2="852" class="arrow" marker-end="url(#arrow)"/>
  <text x="570" y="820" class="arr-label">pure functions, no globals</text>

  <rect x="380" y="934" width="360" height="44" rx="4" class="box-com"/>
  <text x="560" y="952" text-anchor="middle" class="label-bold">PSDResult</text>
  <text x="560" y="970" text-anchor="middle" class="code">freqs · power · ci_lower · ci_upper · unit · method</text>

  <line x1="560" y1="914" x2="560" y2="934" class="arrow" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- Lane 5: plot widgets                                     -->
  <!-- ─────────────────────────────────────────────────────── -->
  <rect x="20" y="1012" width="1080" height="118" class="layer-ui" rx="6"/>
  <text x="36" y="1034" class="lane-label ui-label">spectUI · plot widgets (consume PSDResult and series metrics)</text>

  <rect x="40"  y="1052" width="170" height="62" rx="4" class="box-ui"/>
  <text x="125" y="1075" text-anchor="middle" class="label">PSDPlotWidget</text>
  <text x="125" y="1094" text-anchor="middle" class="sub">PSD tab</text>

  <rect x="230" y="1052" width="170" height="62" rx="4" class="box-ui"/>
  <text x="315" y="1075" text-anchor="middle" class="label">HRPlotWidget</text>
  <text x="315" y="1094" text-anchor="middle" class="sub">IBI Series tab</text>

  <rect x="420" y="1052" width="170" height="62" rx="4" class="box-ui"/>
  <text x="505" y="1075" text-anchor="middle" class="label">PoincarePlotWidget</text>
  <text x="505" y="1094" text-anchor="middle" class="sub">Poincaré tab</text>

  <rect x="610" y="1052" width="170" height="62" rx="4" class="box-ui"/>
  <text x="695" y="1075" text-anchor="middle" class="label">EpochPlotWidget</text>
  <text x="695" y="1094" text-anchor="middle" class="sub">Epochs tab</text>

  <rect x="800" y="1052" width="240" height="62" rx="4" class="box-ui"/>
  <text x="920" y="1075" text-anchor="middle" class="label">ParametersPlotWidget</text>
  <text x="920" y="1094" text-anchor="middle" class="sub">Parameters tab (metrics table)</text>

  <line x1="560" y1="978" x2="560" y2="1012" class="arrow" marker-end="url(#arrow)"/>

  <!-- Footer / legend -->
  <text x="36" y="1166" class="lane-label">Dependency rule</text>
  <text x="36" y="1186" class="sub">spectUI imports from spectHR · spectHR has zero module-level configuration state.</text>
  <text x="36" y="1204" class="sub">All knobs travel as parameters; PsdMethod is the single named bundle the UI hands across the boundary.</text>
  <text x="36" y="1222" class="sub">CardioSeriesView delegates .psd_method to its parent CardioSeries, so a freshly built view picks up the config automatically.</text>
</svg>
