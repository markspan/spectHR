[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specthr"
version = "0.1.1"
description = "HRV / physiological data tooling"
readme = "README.md"
requires-python = ">=3.10,<3.14"

# Modern SPDX license string (fixes the warning)
license = { text = "GPL-2.0-only" }

authors = [
    { name = "M.M. Span", email = "m.m.span@rug.nl" }
]

dependencies = [
    "platformdirs",
    "matplotlib",
    "PySide6",
    "qtawesome",
    "numpy",
    "scipy",
    "pyxdf",
    "mplcursors",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "nuitka",
]

[tool.setuptools.packages]
find = { where = ["src"] , include = ["spectUI*", "spectHR*"]}

[project.urls]
Homepage = "https://github.com/MarkSpan/spectHR"
Repository = "https://github.com/MarkSpan/spectHR"
Issues = "https://github.com/MarkSpan/spectHR/issues"

