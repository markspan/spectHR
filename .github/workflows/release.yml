name: Release (bump tag -> bump version -> Nuitka builds -> GitHub Release)

on:
  push:
    tags:
      - "bump"
      - "bump-*"

permissions:
  contents: write

env:
  # Choose one supported by your pyproject (>=3.10,<3.14).
  PYTHON_VERSION: "3.12"

  # Your entry point (from your Nuitka command)
  ENTRYPOINT: "src/spectUI/MainWindow.py"

  # Your resources include
  RESOURCES_SRC_DIR: "src/spectUI/resources"
  RESOURCES_DST_DIR: "resources"

  # Windows icon (source of truth; used on Windows and converted on macOS)
  WIN_ICON_ICO: "spectHR.ico"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final.outputs.version }}
      release_tag: ${{ steps.final.outputs.release_tag }}
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target version (tag 'bump' auto-patch OR 'bump-x.y.z' explicit)
        id: final
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]  # e.g. "bump" or "bump-0.2.3"
          pyproj = Path("pyproject.toml")
          if not pyproj.exists():
            raise SystemExit("pyproject.toml not found at repo root")

          txt = pyproj.read_text(encoding="utf-8")

          # Find [project] table block
          mproj = re.search(r"(?ms)^\[project\]\s*(.*?)(?=^\[|\Z)", txt)
          if not mproj:
            raise SystemExit("No [project] table found in pyproject.toml")

          block = mproj.group(0)
          mver = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', block)
          if not mver:
            raise SystemExit('No [project].version = "..." found in pyproject.toml')

          current_raw = mver.group(1).strip()

          def normalize_xy_to_xyz(v: str) -> str:
            # Accept X.Y by treating as X.Y.0
            parts = v.split(".")
            if len(parts) == 2 and all(p.isdigit() for p in parts):
              return f"{parts[0]}.{parts[1]}.0"
            return v

          def is_stable_xyz(v: str) -> bool:
            return re.match(r"^\d+\.\d+\.\d+$", v) is not None

          def bump_patch(v: str) -> str:
            mm = re.match(r"^(\d+)\.(\d+)\.(\d+)$", v)
            if not mm:
              raise ValueError(v)
            a, b, c = map(int, mm.groups())
            return f"{a}.{b}.{c+1}"

          if tag == "bump":
            base = normalize_xy_to_xyz(current_raw)
            if not is_stable_xyz(base):
              raise SystemExit(
                f"Auto patch bump requires stable X.Y.Z (or X.Y). "
                f"Current pyproject version is '{current_raw}'. "
                f"Use explicit tag bump-<version> for pre-releases (e.g. bump-0.2.3rc1)."
              )
            version = bump_patch(base)
          elif tag.startswith("bump-"):
            version = tag[len("bump-"):]
            # Allow semver-ish including prerelease/build metadata.
            if not re.match(r"^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z]+)*$", version):
              raise SystemExit(f"Explicit bump tag not valid enough: '{tag}'")
            # Normalize X.Y -> X.Y.0 for consistency in releases
            version = normalize_xy_to_xyz(version)
          else:
            raise SystemExit(f"Unexpected tag: {tag}")

          release_tag = f"v{version}"

          # Write outputs for GitHub Actions
          out_path = Path(os.environ["GITHUB_OUTPUT"])
          out_path.write_text(out_path.read_text() + f"version={version}\nrelease_tag={release_tag}\n", encoding="utf-8")

          print(f"Tag: {tag}")
          print(f"pyproject current: {current_raw}")
          print(f"release version: {version}")
          print(f"release tag: {release_tag}")
          PY

      - name: Bump pyproject.toml [project].version to target version
        env:
          VERSION: ${{ steps.final.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          txt = path.read_text(encoding="utf-8")

          mproj = re.search(r"(?ms)^\[project\]\s*(.*?)(?=^\[|\Z)", txt)
          if not mproj:
            raise SystemExit("No [project] table found in pyproject.toml")

          block = mproj.group(0)
          new_block, n = re.subn(
            r'(?m)^version\s*=\s*".*?"\s*$',
            f'version = "{version}"',
            block,
            count=1
          )
          if n != 1:
            raise SystemExit("Could not replace [project].version exactly once")

          new_txt = txt[:mproj.start()] + new_block + txt[mproj.end():]
          path.write_text(new_txt, encoding="utf-8")
          print(f"Set pyproject.toml [project].version = {version}")
          PY

      - name: Commit bump and push to default branch; create vX.Y.Z tag
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git commit -m "chore(release): bump version to ${{ steps.final.outputs.version }}" || echo "No changes to commit"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          git tag -f "${{ steps.final.outputs.release_tag }}"
          git push -f origin "${{ steps.final.outputs.release_tag }}"

      - name: Export SHA used for builds
        id: sha
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout prepared commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Linux system deps (Qt runtime + Nuitka tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxrender1 \
            libxi6 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libnss3 \
            libasound2 \
            fonts-dejavu-core

      - name: Install project + Nuitka
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install nuitka

      - name: Build with Nuitka (your flags; platform-specific output)
        shell: bash
        run: |
          set -e

          VERSION="${{ needs.prepare.outputs.version }}"
          OUTDIR="dist/${{ runner.os }}"
          mkdir -p "$OUTDIR"

          ENTRY="${{ env.ENTRYPOINT }}"
          if [ ! -f "$ENTRY" ]; then
            echo "Entry not found: $ENTRY"
            echo "Repo root:"
            ls -la
            echo "src/:"
            ls -la src || true
            exit 1
          fi

          if [ ! -f "${{ env.WIN_ICON_ICO }}" ]; then
            echo "Missing icon file: ${{ env.WIN_ICON_ICO }} (place it in repo root)"
            exit 1
          fi

          COMMON_ARGS=(
            "$ENTRY"
            --standalone
            --assume-yes-for-downloads
            --enable-plugin=pyside6
            --include-package=spectHR
            --include-package=spectUI
            --include-data-dir="${{ env.RESOURCES_SRC_DIR }}=${{ env.RESOURCES_DST_DIR }}"
            --output-dir="$OUTDIR"
          )

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python -m nuitka \
              "${COMMON_ARGS[@]}" \
              --onefile \
              --windows-icon-from-ico="${{ env.WIN_ICON_ICO }}" \
              --output-filename="spectHR-Windows-v$VERSION.exe"

          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            # macOS: convert spectHR.ico -> spectHR.icns, build .app, then zip it.
            python -m pip install -q pillow

            ICO_PATH="${{ env.WIN_ICON_ICO }}" python - <<'PY'
            from PIL import Image
            import os

            ico_path = os.environ["ICO_PATH"]
            out_png = "icon_1024.png"

            im = Image.open(ico_path)

            # ICO can contain multiple sizes; choose the largest available frame.
            sizes = []
            for frame in range(getattr(im, "n_frames", 1)):
              try:
                im.seek(frame)
                sizes.append((im.size[0] * im.size[1], frame, im.size))
              except Exception:
                pass

            if not sizes:
              raise SystemExit("Could not read any frames from ICO")

            _, best_frame, best_size = sorted(sizes, reverse=True)[0]
            im.seek(best_frame)
            im.convert("RGBA").save(out_png, format="PNG")
            print(f"Extracted {out_png} from {ico_path} (frame {best_frame}, size {best_size})")
            PY

            ICONSET="spectHR.iconset"
            mkdir -p "$ICONSET"

            /usr/bin/sips -z 16 16     icon_1024.png --out "$ICONSET/icon_16x16.png" >/dev/null
            /usr/bin/sips -z 32 32     icon_1024.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
            /usr/bin/sips -z 32 32     icon_1024.png --out "$ICONSET/icon_32x32.png" >/dev/null
            /usr/bin/sips -z 64 64     icon_1024.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
            /usr/bin/sips -z 128 128   icon_1024.png --out "$ICONSET/icon_128x128.png" >/dev/null
            /usr/bin/sips -z 256 256   icon_1024.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
            /usr/bin/sips -z 256 256   icon_1024.png --out "$ICONSET/icon_256x256.png" >/dev/null
            /usr/bin/sips -z 512 512   icon_1024.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
            /usr/bin/sips -z 512 512   icon_1024.png --out "$ICONSET/icon_512x512.png" >/dev/null
            /usr/bin/sips -z 1024 1024 icon_1024.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null

            /usr/bin/iconutil -c icns "$ICONSET" -o "spectHR.icns"

            if [ ! -f "spectHR.icns" ]; then
              echo "Failed to generate spectHR.icns"
              exit 1
            fi

            python -m nuitka \
              "${COMMON_ARGS[@]}" \
              --macos-create-app-bundle \
              --macos-app-icon="spectHR.icns" \
              --macos-app-name="spectHR" \
              --output-filename="spectHR"

            APP="$(ls -d "$OUTDIR"/*.app | head -n 1)"
            APP_NAME="spectHR-macOS-v$VERSION.app"
            mv "$APP" "$OUTDIR/$APP_NAME"

            cd "$OUTDIR"
            ZIP_NAME="spectHR-macOS-v$VERSION.zip"
            /usr/bin/zip -r "$ZIP_NAME" "$APP_NAME"
            rm -rf "$APP_NAME"

          else
            python -m nuitka \
              "${COMMON_ARGS[@]}" \
              --onefile \
              --output-filename="spectHR-Linux-v$VERSION"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectHR-${{ runner.os }}-v${{ needs.prepare.outputs.version }}
          path: dist/${{ runner.os }}/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*
