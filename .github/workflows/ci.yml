name: CI (spectHR)

on:
  push:
    tags-ignore:
      - "bump"
      - "bump-*"
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Ruff (PEP 8 / lint)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Qt runtime libs
        # PySide6 loads these shared libraries at *import* time; without them
        # `import spectUI` dies on `libEGL.so.1: cannot open shared object file`.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libegl1 \
              libgl1 \
              libglib2.0-0 \
              libdbus-1-3 \
              libxkbcommon0 \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libxcb-icccm4 \
              libxcb-image0 \
              libxcb-keysyms1 \
              libxcb-randr0 \
              libxcb-render-util0 \
              libxcb-shape0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import spectHR, spectUI; print('imports OK')"
