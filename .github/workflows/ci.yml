name: CI (spectHR)

on:
  push:
    tags-ignore:
      - "bump"
      - "bump-*"
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Import smoke test
        run: |
          python -c "import spectHR, spectUI; print('imports OK')"
